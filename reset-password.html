<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | Fullbright College SMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<div class="auth-card">
  <div class="auth-head"><img src="logo.jpg" alt="Fullbright College"><h2>Set a new password</h2><small>Finance &amp; Reporting</small></div>
  <div class="auth-body">
    <form id="resetForm">
      <label>New password</label><input type="password" id="p1" minlength="6" required>
      <label>Confirm new password</label><input type="password" id="p2" minlength="6" required>
      <button class="full" type="submit">Update password</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const msg = (t, c = 'err') => { const m = $('#msg'); m.textContent = t; m.className = 'msg show ' + c; };
$('#resetForm').onsubmit = async e => {
  e.preventDefault();
  if ($('#p1').value !== $('#p2').value) return msg('Passwords do not match.');
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return msg('This reset link is invalid or expired. Request a new one from the login page.');
  const {error} = await sb.auth.updateUser({password: $('#p1').value});
  if (error) return msg(error.message);
  msg('Password updated! Redirecting to login…', 'ok');
  await sb.auth.signOut();
  setTimeout(() => location.href = 'index.html', 1800);
};
</script>
</body>
</html>
